<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#63B632">
  <meta name="description" content="Application des adhérent.e.s Rando's Lorraine">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rando's">
  <title>Rando's Lorraine</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/RL-symb.png" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/RL-symb.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <div id="view-splash" class="splash">
      <div class="screen screen--center">
        <img src="icons/RL-logo.png" alt="" class="splash__logo" width="209" height="151">
        <h1 class="splash__title">chargement en cours ...</h1>
        <div class="spinner" aria-label="Chargement"></div>
      </div>
    </div>

    <div id="view-main" class="hidden">
      <header class="app-bar">
        <button type="button" id="btn-back" class="app-bar__back hidden" aria-label="Retour">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <h1 id="app-bar-title" class="app-bar__title">Rando's Lorraine</h1>
        <span id="app-bar-icon" class="app-bar__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg>
        </span>
      </header>
      <div id="screen-root"></div>
    </div>
  </div>

  <script src="js/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="js/app.js" type="module"></script>
  
  <!-- Fenêtre modale pour proposer un covoiturage -->
<div id="covoiturage-propose-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">Proposer un covoiturage</div>
    <div class="modal-body">
      <form id="covoiturage-propose-form">
        <div class="modal-field">
          <label for="covoiturage-places">Nombre de place(s) proposée(s) :</label>
          <input type="number" id="covoiturage-places" min="1" max="6" required>
        </div>
        <div class="modal-field">
          <label for="covoiturage-lieu">Lieu de rencontre souhaité :</label>
          <input type="text" id="covoiturage-lieu" required>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn--success" id="covoiturage-propose-confirm">Proposer</button>
      <button type="button" class="btn btn--cancel" id="covoiturage-propose-cancel">Annuler</button>
    </div>
  </div>
</div>

<!-- Fenêtre modale pour confirmer la proposition de covoiturage -->
<div id="covoiturage-confirm-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">Confirmer votre proposition</div>
    <div class="modal-body">
      <p id="covoiturage-message"></p>
      <textarea id="covoiturage-message-edit" style="display: none; width: 100%; min-height: 150px; margin-top: 10px;"></textarea>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn--confirm" id="covoiturage-confirm-validate">Valider cette proposition</button>
      <button type="button" class="btn btn--confirm" id="covoiturage-confirm-edit">Modifier ma proposition</button>
      <button type="button" class="btn btn--cancel" id="covoiturage-confirm-cancel">Annuler ma proposition</button>
    </div>
  </div>
</div>
</body>
</html>
